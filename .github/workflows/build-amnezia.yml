name: build Amnezia split list

on:
  schedule:
    - cron: '17 3 * * *' # 06:17 Moscow time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - domains.lst
      - user_subnets.lst
      - scripts/build_amnezia.py
      - .github/workflows/build-amnezia.yml

permissions:
  contents: write

concurrency:
  group: build-amnezia-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build import file
        run: python3 scripts/build_amnezia.py
      - name: Commit changed file
        run: |
          git add ip-list-amnezia.json
          if git diff --cached --quiet -- ip-list-amnezia.json; then
            echo "ip-list-amnezia.json is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh Amnezia split list"
          git push

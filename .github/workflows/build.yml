name: build routing lists

on:
  schedule:
    - cron: '17 3 * * *' # 06:17 Moscow time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - domains.lst
      - user_subnets.lst
      - scripts/build.py
      - scripts/build_amnezia.py
      - scripts/build_allowedips.py
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-routing-lists-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Clash and Amnezia lists
        run: |
          python3 scripts/build.py
          python3 scripts/build_amnezia.py
          python3 scripts/build_allowedips.py
      - name: Commit changed files
        run: |
          git add clash-domains.txt ip-list-amnezia.json allowedips-amneziawg.txt
          if git diff --cached --quiet -- clash-domains.txt ip-list-amnezia.json allowedips-amneziawg.txt; then
            echo "Routing lists are unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh routing lists"
          git push

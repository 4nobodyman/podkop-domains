name: build clash list

on:
  push:
    branches: [main]
    paths:
      - domains.lst
      - scripts/build.py
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сгенерировать clash-domains.txt
        run: python3 scripts/build.py

      - name: Закоммитить, если изменилось
        run: |
          if git diff --quiet -- clash-domains.txt; then
            echo "clash-domains.txt не изменился"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash-domains.txt
          git commit -m "build: обновить clash-domains.txt из domains.lst"
          git push
